{
  "schemaVersion": 2,
  "id": "shared-ntfy",
  "revision": 2,
  "product": "ntfy",
  "artifacts": [
    "ntfy"
  ],
  "networks": [
    "ntfy-private",
    "ntfy-web"
  ],
  "volumes": [
    {
      "id": "ntfy",
      "userId": 65532
    }
  ],
  "inputs": [],
  "processes": [
    {
      "id": "ntfy",
      "artifact": "ntfy",
      "userId": 65532,
      "memoryMiB": 256,
      "networks": [
        "ntfy-private",
        "ntfy-web"
      ],
      "volumes": [
        {
          "volume": "ntfy",
          "target": "/var/cache/ntfy"
        }
      ],
      "command": [
        "serve",
        "--listen-http=:8080",
        "--base-url=http://ntfy:8080",
        "--cache-file=/var/cache/ntfy/cache.db",
        "--attachment-cache-dir=/var/cache/ntfy/attachments",
        "--auth-file=/var/cache/ntfy/auth.db",
        "--auth-default-access=deny-all"
      ],
      "readiness": [
        "/bin/sh",
        "-ec",
        "wget -q -O - http://127.0.0.1:8080/v1/health | grep -q '\"healthy\":true'"
      ]
    }
  ],
  "install": {
    "processes": [
      "ntfy"
    ],
    "dependencies": {
      "ntfy": []
    }
  },
  "restore": {
    "processes": [
      "ntfy"
    ],
    "dependencies": {
      "ntfy": []
    }
  },
  "webNetworks": [
    "ntfy-web"
  ]
}
