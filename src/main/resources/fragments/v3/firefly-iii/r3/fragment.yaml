      "id": "firefly-db-init",
      "artifact": "postgres",
      "userId": 999,
      "entrypoint": "/bin/sh",
      "command": [
        "-ec",
        "psql -X -v ON_ERROR_STOP=1 <<SQL\nCREATE ROLE firefly_migration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '$FIREFLY_MIGRATION_PASSWORD';\nCREATE ROLE firefly_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '$FIREFLY_RUNTIME_PASSWORD';\nCREATE DATABASE firefly OWNER firefly_migration;\nREVOKE ALL ON DATABASE firefly FROM PUBLIC;\nGRANT CONNECT ON DATABASE firefly TO firefly_runtime;\nSQL\npsql -X -d firefly -v ON_ERROR_STOP=1 <<'SQL'\nREVOKE CREATE ON SCHEMA public FROM PUBLIC;\nGRANT USAGE ON SCHEMA public TO firefly_runtime;\nALTER DEFAULT PRIVILEGES FOR ROLE firefly_migration IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO firefly_runtime;\nALTER DEFAULT PRIVILEGES FOR ROLE firefly_migration IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO firefly_runtime;\nSQL"
      ],
      "environmentFile": "firefly-db-admin.env",
      "files": [
        {
          "file": "postgres-ca.pem",
          "target": "/run/secrets/postgres-ca.pem"
        }
      ],
      "oneShot": true,
      "networks": [
        "db-admin"
      ]
    },
    {
      "id": "firefly-db-finalize",
      "artifact": "postgres",
      "userId": 999,
      "entrypoint": "/bin/sh",
      "command": [
        "-ec",
        "psql -X -d firefly -v ON_ERROR_STOP=1 <<'SQL'\nGRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO firefly_runtime;\nGRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO firefly_runtime;\nALTER ROLE firefly_migration NOLOGIN;\nSQL"
      ],
      "environmentFile": "firefly-db-admin.env",
      "files": [
        {
          "file": "postgres-ca.pem",
          "target": "/run/secrets/postgres-ca.pem"
        }
