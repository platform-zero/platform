schemaVersion: 2
id: shared-valkey-acl
revision: 2
product: valkey
artifacts: [valkey]
networks: [cache-private]
volumes:
  - {id: valkey, userId: 999}
inputs:
  - {name: valkey.conf, owner: valkey, purpose: RUNTIME, consumers: [valkey]}
  - {name: valkey.acl, owner: valkey, purpose: RUNTIME, consumers: [valkey]}
  - {name: valkey-health.env, owner: valkey, purpose: RUNTIME, consumers: [valkey]}
processes:
  - id: valkey
    artifact: valkey
    userId: 999
    memoryMiB: 256
    entrypoint: /usr/local/bin/valkey-server
    command: [/etc/valkey/valkey.conf]
    environmentFile: valkey-health.env
    networks: [cache-private]
    volumes:
      - {volume: valkey, target: /data}
    files:
      - {file: valkey.conf, target: /etc/valkey/valkey.conf}
      - {file: valkey.acl, target: /etc/valkey/users.acl}
    readiness:
      - /bin/sh
      - -ec
      - 'test "$(valkey-cli --user health --pass "$VALKEY_HEALTH_PASSWORD" ping 2>/dev/null)" = PONG'
install:
  processes: [valkey]
  dependencies:
    valkey: []
restore:
  processes: [valkey]
  dependencies:
    valkey: []
