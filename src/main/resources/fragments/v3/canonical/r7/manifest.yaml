  deviations:
  - id: vault
    source: vaultwarden/pass reference Caddy routes
    destination: Keykeeper plus OpenBao
    contract: independent identities, encrypted secrets, separate recovery; no Vaultwarden or compatibility claim
  - id: postgres
    source: postgres plus postgres-ssd
    destination: one PostgreSQL 17 Timescale owner
    contract: independent application roles/databases, verified TLS, compatible Timescale extension only where declared
  - id: forgejo-ci
    source: forgejo plus forgejo-runner
    destination: PostgreSQL-backed Forgejo plus isolated rootless CI
    contract: scoped trusted repos and rootless runner; no host jobs, socket or registration secrets in jobs
  - id: managed-lanes
    source: test-runners plus jupyter-notebook
    destination: Worklane plus TUIOS/Pi owned managed lanes
    contract: genuine jobs and authentic image/tool custody; no phantom daemon or VM
  - id: backup
    source: kopia container and all original state
    destination: Kopia sole new-production encrypted snapshot owner
    contract: stopped consistent per-app data, isolated restore, original custody, no raw live database copy
  - id: identity
    source: keycloak plus auth gateway and onboarding
    destination: Keycloak plus invite-only operator-assisted enrollment
    contract: PKCE TOTP and 30-minute recovery; app grants independently verified, no unreviewed auth gateway
  - id: routes
    source: historical Caddyfile virtual hosts
    destination: private unactivated approved ingress
    contract: TLS/backend trust, Matrix API and federation, WebSocket, RTC UDP and mail ports separately verified
  - id: lifecycle
    source: historical compose restart and legacy Podman scripts
    destination: owned Quadlet/systemd only
    contract: original CID and ACK custody, fences, no uncertain replay or direct-Podman application fallback
  - id: search
    source: Huly elastic plus shared opensearch
    destination: separate version-compatible Huly index and OpenSearch
    contract: do not substitute OpenSearch without tested compatibility
  - id: resource
    source: unbounded old service limits
    destination: single resource-admitted private release
    contract: 16384 MiB available-memory and 10240 MiB free-disk headroom, no partial-release qualification
